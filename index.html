<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BATTLESHIPS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap');

:root {
  --bg:        #0a0e14;
  --surface:   #0f1620;
  --border:    #1e3a5f;
  --accent:    #00c8ff;
  --danger:    #ff3a3a;
  --hit:       #ff5e00;
  --miss:      #1e3a5f;
  --ship:      #2a6496;
  --text:      #c8dff0;
  --dim:       #4a6a8a;
  --green:     #00ff88;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Share Tech Mono', monospace;
  min-height: 100vh;
  overflow-x: hidden;
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(0,60,120,0.15) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 20%, rgba(0,200,255,0.05) 0%, transparent 40%);
}

/* Scanline overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.03) 2px,
    rgba(0,0,0,0.03) 4px
  );
  pointer-events: none;
  z-index: 9999;
}

h1 {
  font-family: 'Bebas Neue', sans-serif;
  letter-spacing: 0.15em;
  color: var(--accent);
  text-shadow: 0 0 20px rgba(0,200,255,0.5), 0 0 60px rgba(0,200,255,0.2);
}

/* ── Screens ── */
.screen { display: none; animation: fadeIn 0.3s ease; }
.screen.active { display: flex; flex-direction: column; align-items: center; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ── Lobby ── */
#lobby {
  justify-content: center;
  min-height: 100vh;
  gap: 2rem;
  padding: 2rem;
}

.logo {
  text-align: center;
}
.logo h1 { font-size: clamp(3rem, 10vw, 6rem); }
.logo p  { color: var(--dim); font-size: 0.85rem; letter-spacing: 0.2em; margin-top: 0.25rem; }

.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2rem;
  width: min(400px, 90vw);
  position: relative;
}
.panel::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
}

.panel h2 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.4rem;
  letter-spacing: 0.1em;
  color: var(--accent);
  margin-bottom: 1.5rem;
}

.input-group { display: flex; gap: 0.5rem; }

input[type=text] {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'Share Tech Mono', monospace;
  font-size: 1.1rem;
  padding: 0.6rem 1rem;
  border-radius: 3px;
  text-transform: uppercase;
  letter-spacing: 0.2em;
  outline: none;
  transition: border-color 0.2s;
}
input[type=text]:focus { border-color: var(--accent); }
input[type=text]::placeholder { color: var(--dim); text-transform: none; letter-spacing: 0; }

.btn {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.1rem;
  letter-spacing: 0.1em;
  padding: 0.6rem 1.5rem;
  border: none;
  border-radius: 3px;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-primary {
  background: var(--accent);
  color: var(--bg);
}
.btn-primary:hover { filter: brightness(1.15); transform: translateY(-1px); }
.btn-secondary {
  background: transparent;
  color: var(--accent);
  border: 1px solid var(--accent);
}
.btn-secondary:hover { background: rgba(0,200,255,0.1); }
.btn-danger {
  background: var(--danger);
  color: white;
}
.btn-danger:hover { filter: brightness(1.2); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

.divider {
  border: none;
  border-top: 1px solid var(--border);
  margin: 1.5rem 0;
}

.error-msg {
  color: var(--danger);
  font-size: 0.8rem;
  margin-top: 0.5rem;
  min-height: 1rem;
}

/* ── Waiting ── */
#waiting {
  justify-content: center;
  min-height: 100vh;
  gap: 1.5rem;
  text-align: center;
  padding: 2rem;
}
.code-display {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(3rem, 12vw, 5rem);
  color: var(--accent);
  letter-spacing: 0.3em;
  text-shadow: 0 0 30px rgba(0,200,255,0.4);
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 0.5rem 2rem;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
}
.code-display:hover { border-color: var(--accent); }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

/* ── Placement ── */
#placement {
  padding: 1.5rem;
  gap: 1.5rem;
  align-items: center;
  min-height: 100vh;
}

.placement-top {
  display: flex;
  gap: 2rem;
  width: 100%;
  max-width: 900px;
  align-items: flex-start;
  flex-wrap: wrap;
  justify-content: center;
}

.ship-list {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1rem;
  min-width: 200px;
}
.ship-list h3 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.1rem;
  color: var(--accent);
  letter-spacing: 0.1em;
  margin-bottom: 1rem;
}
.ship-item {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.5rem;
  border-radius: 3px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.15s;
  margin-bottom: 0.4rem;
}
.ship-item:hover { background: rgba(0,200,255,0.05); border-color: var(--border); }
.ship-item.selected { background: rgba(0,200,255,0.1); border-color: var(--accent); }
.ship-item.placed { opacity: 0.4; pointer-events: none; }
.ship-item.placed .ship-name { text-decoration: line-through; }
.ship-cells {
  display: flex;
  gap: 2px;
}
.ship-cell-preview {
  width: 14px; height: 14px;
  background: var(--ship);
  border-radius: 2px;
}
.ship-name { font-size: 0.85rem; flex: 1; }
.ship-size { color: var(--dim); font-size: 0.75rem; }

.placement-controls {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
  margin-top: 0.5rem;
}

/* ── Grid ── */
.grid-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
}
.grid-label {
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  color: var(--dim);
  text-align: center;
}
.grid-container { position: relative; }

.grid {
  display: grid;
  grid-template-columns: 20px repeat(10, 1fr);
  grid-template-rows: 20px repeat(10, 1fr);
  gap: 2px;
  user-select: none;
}

.grid-corner { width: 20px; height: 20px; }
.grid-header {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.65rem;
  color: var(--dim);
  width: 100%;
  height: 20px;
}
.grid-row-label {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.65rem;
  color: var(--dim);
}

.cell {
  width: clamp(28px, 4vw, 38px);
  height: clamp(28px, 4vw, 38px);
  background: rgba(14, 30, 50, 0.8);
  border: 1px solid rgba(30,58,95,0.5);
  border-radius: 2px;
  cursor: default;
  transition: all 0.15s;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Placement grid cells */
.cell.ship {
  background: var(--ship);
  border-color: rgba(0,200,255,0.4);
}
.cell.preview {
  background: rgba(0,200,255,0.2);
  border-color: var(--accent);
}
.cell.preview-invalid {
  background: rgba(255,58,58,0.2);
  border-color: var(--danger);
}
.cell.placeable:hover {
  background: rgba(0,200,255,0.15);
  border-color: var(--accent);
  cursor: crosshair;
}

/* Game grid cells */
.cell.hit {
  background: var(--hit) !important;
  border-color: #ff8c00 !important;
}
.cell.hit::after {
  content: '✕';
  color: white;
  font-size: 1rem;
  font-weight: bold;
}
.cell.miss {
  background: var(--miss) !important;
  border-color: rgba(30,58,95,0.8) !important;
}
.cell.miss::after {
  content: '•';
  color: var(--dim);
  font-size: 1.2rem;
}
.cell.my-ship {
  background: rgba(42,100,150,0.6);
  border-color: rgba(0,200,255,0.3);
}
.cell.my-ship-hit {
  background: var(--danger) !important;
  border-color: #ff6b6b !important;
}
.cell.my-ship-hit::after {
  content: '✕';
  color: white;
  font-size: 1rem;
}
.cell.enemy-target:hover {
  background: rgba(255,94,0,0.2);
  border-color: var(--hit);
  cursor: crosshair;
}
.cell.not-my-turn { cursor: not-allowed !important; }
.cell.unknown { }

/* ── Game screen ── */
#game {
  padding: 1.5rem;
  gap: 1rem;
  align-items: center;
  min-height: 100vh;
}

.game-header {
  display: flex;
  align-items: center;
  gap: 1rem;
  width: 100%;
  max-width: 900px;
}
.game-header h1 { font-size: 1.8rem; }

.status-bar {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 0.6rem 1.2rem;
  font-size: 0.9rem;
  letter-spacing: 0.05em;
  flex: 1;
  text-align: center;
}
.status-bar.my-turn   { border-color: var(--green); color: var(--green); }
.status-bar.their-turn { border-color: var(--dim); color: var(--dim); }
.status-bar.game-over  { border-color: var(--accent); color: var(--accent); }

.boards-row {
  display: flex;
  gap: 2rem;
  flex-wrap: wrap;
  justify-content: center;
}

.sunk-list {
  margin-top: 0.5rem;
  font-size: 0.7rem;
  color: var(--dim);
  min-height: 1rem;
}
.sunk-ship { color: var(--danger); }

/* ── Overlay ── */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 100;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 1.5rem;
  backdrop-filter: blur(4px);
}
.overlay.active { display: flex; animation: fadeIn 0.3s ease; }
.overlay-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 3rem;
  text-align: center;
  max-width: 360px;
  width: 90%;
  position: relative;
}
.overlay-box::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  border-radius: 6px;
  box-shadow: 0 0 60px rgba(0,200,255,0.15);
  pointer-events: none;
}
.overlay-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 3rem;
  letter-spacing: 0.1em;
  margin-bottom: 0.5rem;
}
.win  .overlay-title { color: var(--green); text-shadow: 0 0 20px rgba(0,255,136,0.5); }
.lose .overlay-title { color: var(--danger); text-shadow: 0 0 20px rgba(255,58,58,0.5); }
.overlay-sub { color: var(--dim); font-size: 0.9rem; margin-bottom: 1.5rem; }
.overlay-btns { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }

/* ── Notification toast ── */
.toast {
  position: fixed;
  bottom: 1.5rem;
  left: 50%;
  transform: translateX(-50%) translateY(4rem);
  background: var(--surface);
  border: 1px solid var(--accent);
  color: var(--accent);
  padding: 0.6rem 1.5rem;
  border-radius: 4px;
  font-size: 0.85rem;
  z-index: 200;
  transition: transform 0.3s ease;
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* ── Responsive ── */
@media (max-width: 600px) {
  .placement-top { gap: 1rem; }
  .boards-row { gap: 1rem; }
  .cell { width: 26px; height: 26px; }
}
</style>
</head>
<body>

<!-- ══ LOBBY ══════════════════════════════════════════════════════════════ -->
<div id="lobby" class="screen active">
  <div class="logo">
    <h1>BATTLESHIPS</h1>
    <p>ONLINE NAVAL WARFARE</p>
  </div>

  <div class="panel">
    <h2>⚓ New Game</h2>
    <button class="btn btn-primary" style="width:100%" onclick="createRoom()">CREATE ROOM</button>

    <hr class="divider">

    <h2>🔗 Join Game</h2>
    <div class="input-group">
      <input type="text" id="joinCode" placeholder="Room code (e.g. ABCD)" maxlength="4">
      <button class="btn btn-secondary" onclick="joinRoom()">JOIN</button>
    </div>
    <div class="error-msg" id="lobbyError"></div>
  </div>
</div>

<!-- ══ WAITING ════════════════════════════════════════════════════════════ -->
<div id="waiting" class="screen">
  <div class="logo"><h1>BATTLESHIPS</h1></div>
  <p style="color:var(--dim);letter-spacing:0.15em;font-size:0.8rem">ROOM CODE</p>
  <div class="code-display" id="roomCodeDisplay" onclick="copyCode()" title="Click to copy"></div>
  <p style="color:var(--dim);font-size:0.85rem">Share this code with your opponent</p>
  <p class="pulse" style="color:var(--accent);font-size:0.9rem">⟳ Waiting for opponent…</p>
  <button class="btn btn-secondary" onclick="goLobby()" style="margin-top:1rem">← Back</button>
</div>

<!-- ══ PLACEMENT ══════════════════════════════════════════════════════════ -->
<div id="placement" class="screen">
  <h1 style="font-size:2rem;letter-spacing:0.1em">PLACE YOUR FLEET</h1>

  <div class="placement-top">
    <!-- Ship selector -->
    <div class="ship-list">
      <h3>YOUR SHIPS</h3>
      <div id="shipSelector"></div>
      <div class="placement-controls" style="margin-top:1rem">
        <button class="btn btn-secondary" onclick="rotateShip()">↻ ROTATE</button>
        <button class="btn btn-secondary" onclick="randomPlace()">⚄ RANDOM</button>
        <button class="btn btn-secondary" onclick="clearBoard()">✕ CLEAR</button>
      </div>
      <div id="placementStatus" style="margin-top:0.75rem;font-size:0.8rem;color:var(--dim)"></div>
    </div>

    <!-- Placement grid -->
    <div class="grid-wrapper">
      <div class="grid-label">CLICK TO PLACE — RIGHT-CLICK TO ROTATE</div>
      <div id="placementGrid" class="grid-container"></div>
    </div>
  </div>

  <div style="display:flex;gap:1rem;flex-wrap:wrap;justify-content:center">
    <button class="btn btn-primary" id="confirmBtn" onclick="confirmPlacement()" disabled>
      ✓ CONFIRM PLACEMENT
    </button>
  </div>

  <div id="waitingOpponent" style="display:none;color:var(--dim);font-size:0.85rem" class="pulse">
    Waiting for opponent to place ships…
  </div>
</div>

<!-- ══ GAME ════════════════════════════════════════════════════════════════ -->
<div id="game" class="screen">
  <div class="game-header">
    <h1>BATTLESHIPS</h1>
    <div class="status-bar" id="statusBar">—</div>
  </div>

  <div class="boards-row">
    <!-- My board -->
    <div class="grid-wrapper">
      <div class="grid-label" id="myBoardLabel">MY FLEET</div>
      <div id="myGrid" class="grid-container"></div>
      <div class="sunk-list" id="sunkByOpp"></div>
    </div>
    <!-- Enemy board -->
    <div class="grid-wrapper">
      <div class="grid-label" id="enemyBoardLabel">ENEMY WATERS</div>
      <div id="enemyGrid" class="grid-container"></div>
      <div class="sunk-list" id="sunkByMe"></div>
    </div>
  </div>
</div>

<!-- ══ WIN/LOSE OVERLAY ════════════════════════════════════════════════════ -->
<div class="overlay" id="resultOverlay">
  <div class="overlay-box" id="resultBox">
    <div class="overlay-title" id="resultTitle">—</div>
    <div class="overlay-sub" id="resultSub">—</div>
    <div class="overlay-btns">
      <button class="btn btn-primary" onclick="requestRematch()">↺ REMATCH</button>
      <button class="btn btn-secondary" onclick="goLobby()">⌂ LOBBY</button>
    </div>
  </div>
</div>

<!-- ══ TOAST ═══════════════════════════════════════════════════════════════ -->
<div class="toast" id="toast"></div>

<script>
// ── Constants ────────────────────────────────────────────────────────────────
const GRID_SIZE = 10;
const SHIPS = [
  { name: "Carrier",    size: 5 },
  { name: "Battleship", size: 4 },
  { name: "Cruiser",    size: 3 },
  { name: "Submarine",  size: 3 },
  { name: "Destroyer",  size: 2 },
];
const COLS = "ABCDEFGHIJ";

// ── State ────────────────────────────────────────────────────────────────────
let ws = null;
let myPlayer = null;
let roomCode = null;
let currentScreen = 'lobby';

// Placement state
let placementBoard = Array.from({length: GRID_SIZE}, () => Array(GRID_SIZE).fill(null));
let placedShips = {};      // name -> [{r,c}]
let selectedShip = null;
let orientation = 'H';     // H or V
let hoverCells = [];
let myShipData = [];        // sent to server

// Game state
let gameState = null;
let myReady = false;

// ── WebSocket ─────────────────────────────────────────────────────────────────
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const host  = location.hostname;
  ws = new WebSocket(`${proto}://${host}:8765`);
  ws.onmessage = e => handleMessage(JSON.parse(e.data));
  ws.onclose   = () => { if (currentScreen !== 'lobby') toast('Connection lost. Refresh to reconnect.', 4000); };
  ws.onerror   = () => {};
}

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

// ── Message Handler ───────────────────────────────────────────────────────────
function handleMessage(msg) {
  switch (msg.type) {
    case 'joined':
      myPlayer = msg.player;
      roomCode = msg.code;
      if (myPlayer === 0) showWaiting();
      else showPlacement(); // player 1 goes straight to placement
      break;

    case 'opponent_joined':
      showPlacement();
      break;

    case 'placed':
      myReady = true;
      document.getElementById('waitingOpponent').style.display = 'block';
      document.getElementById('confirmBtn').disabled = true;
      document.getElementById('placementStatus').textContent = 'Ships confirmed! Waiting for opponent…';
      break;

    case 'opponent_placed':
      toast('Opponent has placed their ships!');
      break;

    case 'start':
      showGame();
      break;

    case 'state':
      gameState = msg;
      renderGame();
      break;

    case 'rematch':
      closeOverlay();
      placementBoard = Array.from({length: GRID_SIZE}, () => Array(GRID_SIZE).fill(null));
      placedShips = {};
      myShipData = [];
      selectedShip = null;
      myReady = false;
      orientation = 'H';
      showPlacement();
      break;

    case 'opponent_left':
      toast('Opponent disconnected.', 4000);
      closeOverlay();
      break;

    case 'error':
      toast('⚠ ' + msg.msg, 3000);
      break;
  }
}

// ── Lobby ─────────────────────────────────────────────────────────────────────
function createRoom() {
  connect();
  ws.onopen = () => send({ type: 'create' });
}

function joinRoom() {
  const code = document.getElementById('joinCode').value.trim().toUpperCase();
  if (code.length !== 4) { setError('Enter a 4-letter room code'); return; }
  connect();
  ws.onopen = () => send({ type: 'join', code });
}

function setError(msg) {
  document.getElementById('lobbyError').textContent = msg;
}

function goLobby() {
  if (ws) { ws.close(); ws = null; }
  closeOverlay();
  showScreen('lobby');
  document.getElementById('joinCode').value = '';
  setError('');
}

// ── Screens ───────────────────────────────────────────────────────────────────
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(name).classList.add('active');
  currentScreen = name;
}

function showWaiting() {
  document.getElementById('roomCodeDisplay').textContent = roomCode;
  showScreen('waiting');
}

function showPlacement() {
  buildShipSelector();
  buildPlacementGrid();
  document.getElementById('waitingOpponent').style.display = 'none';
  document.getElementById('placementStatus').textContent = '';
  document.getElementById('confirmBtn').disabled = true;
  showScreen('placement');
}

function showGame() {
  showScreen('game');
}

function copyCode() {
  navigator.clipboard.writeText(roomCode).then(() => toast('Room code copied!'));
}

// ── Placement Grid ────────────────────────────────────────────────────────────
function buildPlacementGrid() {
  const container = document.getElementById('placementGrid');
  container.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'grid';

  // Corner
  const corner = document.createElement('div');
  corner.className = 'grid-corner';
  grid.appendChild(corner);

  // Column headers A-J
  for (let c = 0; c < GRID_SIZE; c++) {
    const h = document.createElement('div');
    h.className = 'grid-header';
    h.textContent = COLS[c];
    grid.appendChild(h);
  }

  // Rows
  for (let r = 0; r < GRID_SIZE; r++) {
    const rowLabel = document.createElement('div');
    rowLabel.className = 'grid-row-label';
    rowLabel.textContent = r + 1;
    grid.appendChild(rowLabel);

    for (let c = 0; c < GRID_SIZE; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell placeable';
      cell.dataset.r = r;
      cell.dataset.c = c;
      cell.addEventListener('mouseenter', () => onPlacementHover(r, c));
      cell.addEventListener('mouseleave', () => clearHover());
      cell.addEventListener('click', () => onPlacementClick(r, c));
      cell.addEventListener('contextmenu', e => { e.preventDefault(); rotateShip(); });
      grid.appendChild(cell);
    }
  }

  container.appendChild(grid);
  renderPlacementBoard();
}

function buildShipSelector() {
  const container = document.getElementById('shipSelector');
  container.innerHTML = '';
  SHIPS.forEach(ship => {
    const item = document.createElement('div');
    item.className = 'ship-item' + (placedShips[ship.name] ? ' placed' : '');
    item.id = `ship-${ship.name}`;
    item.onclick = () => selectShip(ship.name);

    const cells = document.createElement('div');
    cells.className = 'ship-cells';
    for (let i = 0; i < ship.size; i++) {
      const sc = document.createElement('div');
      sc.className = 'ship-cell-preview';
      cells.appendChild(sc);
    }

    const name = document.createElement('span');
    name.className = 'ship-name';
    name.textContent = ship.name;

    const size = document.createElement('span');
    size.className = 'ship-size';
    size.textContent = `×${ship.size}`;

    item.appendChild(cells);
    item.appendChild(name);
    item.appendChild(size);
    container.appendChild(item);
  });
}

function selectShip(name) {
  if (placedShips[name]) return;
  selectedShip = name;
  document.querySelectorAll('.ship-item').forEach(el => el.classList.remove('selected'));
  const el = document.getElementById(`ship-${name}`);
  if (el) el.classList.add('selected');
}

function rotateShip() {
  orientation = orientation === 'H' ? 'V' : 'H';
  clearHover();
}

function previewCells(r, c) {
  if (!selectedShip) return [];
  const ship = SHIPS.find(s => s.name === selectedShip);
  if (!ship) return [];
  const cells = [];
  for (let i = 0; i < ship.size; i++) {
    cells.push(orientation === 'H' ? { r, c: c + i } : { r: r + i, c });
  }
  return cells;
}

function isValidPreview(cells) {
  for (const {r, c} of cells) {
    if (r < 0 || r >= GRID_SIZE || c < 0 || c >= GRID_SIZE) return false;
    if (placementBoard[r][c] !== null) return false;
  }
  return true;
}

function onPlacementHover(r, c) {
  if (!selectedShip) return;
  hoverCells = previewCells(r, c);
  renderPlacementBoard();
}

function clearHover() {
  hoverCells = [];
  renderPlacementBoard();
}

function onPlacementClick(r, c) {
  if (!selectedShip) return;
  const cells = previewCells(r, c);
  if (!isValidPreview(cells)) return;

  // Remove existing placement if re-placing
  if (placedShips[selectedShip]) {
    placedShips[selectedShip].forEach(({r, c}) => { placementBoard[r][c] = null; });
  }

  cells.forEach(({r, c}) => { placementBoard[r][c] = selectedShip; });
  placedShips[selectedShip] = cells;
  hoverCells = [];

  // Update ship selector
  const el = document.getElementById(`ship-${selectedShip}`);
  if (el) el.classList.add('placed');

  // Auto-select next unplaced ship
  const next = SHIPS.find(s => !placedShips[s.name]);
  selectedShip = next ? next.name : null;
  buildShipSelector();
  if (selectedShip) selectShip(selectedShip);

  renderPlacementBoard();
  checkAllPlaced();
}

function renderPlacementBoard() {
  const validPreview = hoverCells.length > 0 ? isValidPreview(hoverCells) : true;
  const hoverSet = new Set(hoverCells.map(({r,c}) => `${r},${c}`));

  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      const cell = document.querySelector(`#placementGrid .cell[data-r="${r}"][data-c="${c}"]`);
      if (!cell) continue;
      cell.className = 'cell placeable';
      const coord = `${r},${c}`;
      if (hoverSet.has(coord)) {
        cell.classList.add(validPreview ? 'preview' : 'preview-invalid');
      } else if (placementBoard[r][c]) {
        cell.classList.add('ship');
      }
    }
  }
}

function checkAllPlaced() {
  const allPlaced = SHIPS.every(s => placedShips[s.name]);
  document.getElementById('confirmBtn').disabled = !allPlaced || myReady;
  if (allPlaced) {
    document.getElementById('placementStatus').textContent = 'All ships placed! Confirm when ready.';
  }
}

function clearBoard() {
  placementBoard = Array.from({length: GRID_SIZE}, () => Array(GRID_SIZE).fill(null));
  placedShips = {};
  selectedShip = null;
  hoverCells = [];
  buildShipSelector();
  renderPlacementBoard();
  checkAllPlaced();
}

function randomPlace() {
  clearBoard();
  SHIPS.forEach(ship => {
    let placed = false;
    let tries = 0;
    while (!placed && tries < 200) {
      tries++;
      const o = Math.random() < 0.5 ? 'H' : 'V';
      const r = Math.floor(Math.random() * GRID_SIZE);
      const c = Math.floor(Math.random() * GRID_SIZE);
      const cells = [];
      let valid = true;
      for (let i = 0; i < ship.size; i++) {
        const nr = o === 'V' ? r + i : r;
        const nc = o === 'H' ? c + i : c;
        if (nr >= GRID_SIZE || nc >= GRID_SIZE || placementBoard[nr][nc] !== null) {
          valid = false; break;
        }
        cells.push({r: nr, c: nc});
      }
      if (valid) {
        cells.forEach(({r, c}) => { placementBoard[r][c] = ship.name; });
        placedShips[ship.name] = cells;
        placed = true;
      }
    }
  });
  buildShipSelector();
  renderPlacementBoard();
  checkAllPlaced();
}

function confirmPlacement() {
  if (myReady) return;
  const ships = SHIPS.map(ship => ({
    name: ship.name,
    size: ship.size,
    cells: placedShips[ship.name],
  }));
  myShipData = ships;
  send({ type: 'place', ships });
}

// ── Game Rendering ────────────────────────────────────────────────────────────
function buildGameGrid(containerId, clickable) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'grid';

  const corner = document.createElement('div');
  corner.className = 'grid-corner';
  grid.appendChild(corner);

  for (let c = 0; c < GRID_SIZE; c++) {
    const h = document.createElement('div');
    h.className = 'grid-header';
    h.textContent = COLS[c];
    grid.appendChild(h);
  }

  for (let r = 0; r < GRID_SIZE; r++) {
    const rowLabel = document.createElement('div');
    rowLabel.className = 'grid-row-label';
    rowLabel.textContent = r + 1;
    grid.appendChild(rowLabel);

    for (let c = 0; c < GRID_SIZE; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r;
      cell.dataset.c = c;
      if (clickable) {
        cell.addEventListener('click', () => fireShot(r, c));
      }
      grid.appendChild(cell);
    }
  }

  container.appendChild(grid);
}

function renderGame() {
  if (!gameState) return;
  const { my_board, enemy_board, my_turn, over, winner, sunk_by_me, sunk_by_opp } = gameState;

  // Build grids if not built
  if (!document.querySelector('#myGrid .grid')) buildGameGrid('myGrid', false);
  if (!document.querySelector('#enemyGrid .grid')) buildGameGrid('enemyGrid', true);

  // My board
  if (my_board) {
    for (let r = 0; r < GRID_SIZE; r++) {
      for (let c = 0; c < GRID_SIZE; c++) {
        const cell = document.querySelector(`#myGrid .cell[data-r="${r}"][data-c="${c}"]`);
        if (!cell) continue;
        const val = my_board[r][c];
        cell.className = 'cell';
        if (val === 'hit') cell.classList.add('my-ship-hit');
        else if (val === 'miss') cell.classList.add('miss');
        else if (val === 'ship') cell.classList.add('my-ship');
      }
    }
  }

  // Enemy board
  if (enemy_board) {
    for (let r = 0; r < GRID_SIZE; r++) {
      for (let c = 0; c < GRID_SIZE; c++) {
        const cell = document.querySelector(`#enemyGrid .cell[data-r="${r}"][data-c="${c}"]`);
        if (!cell) continue;
        const val = enemy_board[r][c];
        cell.className = 'cell';
        if (val === 'hit') cell.classList.add('hit');
        else if (val === 'miss') cell.classList.add('miss');
        else {
          cell.classList.add('unknown');
          if (my_turn && !over) cell.classList.add('enemy-target');
          else cell.classList.add('not-my-turn');
        }
      }
    }
  }

  // Status bar
  const bar = document.getElementById('statusBar');
  if (over) {
    const iWon = winner === myPlayer;
    bar.textContent = iWon ? '🏆 VICTORY' : '💀 DEFEAT';
    bar.className = 'status-bar game-over';
    showResult(iWon);
  } else {
    bar.textContent = my_turn ? '⚡ YOUR TURN — FIRE!' : '⏳ ENEMY TURN — INCOMING…';
    bar.className = `status-bar ${my_turn ? 'my-turn' : 'their-turn'}`;
  }

  // Sunk lists
  const sunkByMeEl  = document.getElementById('sunkByMe');
  const sunkByOppEl = document.getElementById('sunkByOpp');
  sunkByMeEl.innerHTML  = sunk_by_me && sunk_by_me.length  ? 'SUNK: ' + sunk_by_me.map(s  => `<span class="sunk-ship">${s}</span>`).join(', ')  : '';
  sunkByOppEl.innerHTML = sunk_by_opp && sunk_by_opp.length ? 'LOST: ' + sunk_by_opp.map(s => `<span class="sunk-ship">${s}</span>`).join(', ') : '';
}

function fireShot(r, c) {
  if (!gameState || !gameState.my_turn || gameState.over) return;
  const val = gameState.enemy_board && gameState.enemy_board[r][c];
  if (val === 'hit' || val === 'miss') return;
  send({ type: 'fire', r, c });
}

// ── Result Overlay ────────────────────────────────────────────────────────────
function showResult(iWon) {
  const overlay = document.getElementById('resultOverlay');
  const box     = document.getElementById('resultBox');
  const title   = document.getElementById('resultTitle');
  const sub     = document.getElementById('resultSub');

  box.className = 'overlay-box ' + (iWon ? 'win' : 'lose');
  title.textContent = iWon ? 'VICTORY!' : 'DEFEAT';
  sub.textContent   = iWon ? 'You sank the enemy fleet!' : 'Your fleet has been destroyed.';
  overlay.classList.add('active');
}

function closeOverlay() {
  document.getElementById('resultOverlay').classList.remove('active');
}

function requestRematch() {
  send({ type: 'rematch' });
  closeOverlay();
}

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer = null;
function toast(msg, duration = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), duration);
}

// ── Enter key on join field ───────────────────────────────────────────────────
document.getElementById('joinCode').addEventListener('keydown', e => {
  if (e.key === 'Enter') joinRoom();
});
</script>
